apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-app
  template:
    metadata:
      labels:
        app: devops-app
    spec:
      containers:
        - name: devops-app
          image: jaccamsi/devops-app:654580fa6a314ebbe569289c67f836401a0b77d1
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://db.database:5432/devops
          envFrom:
            - configMapRef:
                name: devops-app-config
